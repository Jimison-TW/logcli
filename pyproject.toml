[project]
name = "logcli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jimison.chu@datacom.com.tw", email = "jimison.chu@datacom.com.tw" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[project.scripts]
logcli = "logcli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]
